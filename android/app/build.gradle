apply plugin: 'com.android.application'
// Makes google-services.json values available to Firebase SDKs
apply plugin: 'com.google.gms.google-services'

android {
    namespace = "app.kora.reader"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.kora.reader"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(project.hasProperty('KORA_VERSION_CODE') ? KORA_VERSION_CODE : '1')
        versionName project.hasProperty('KORA_VERSION_NAME') ? KORA_VERSION_NAME : '1.0.0'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            // Prefer upload-key properties from CI secrets; never fall back to a committed keystore.
            def storePath = project.hasProperty('KORA_UPLOAD_STORE_FILE')
                ? KORA_UPLOAD_STORE_FILE
                : 'keystore/kora-ci.jks'
            def storePass = project.hasProperty('KORA_UPLOAD_STORE_PASSWORD')
                ? KORA_UPLOAD_STORE_PASSWORD
                : 'koraci-release'
            def alias = project.hasProperty('KORA_UPLOAD_KEY_ALIAS')
                ? KORA_UPLOAD_KEY_ALIAS
                : 'kora'
            def keyPass = project.hasProperty('KORA_UPLOAD_KEY_PASSWORD')
                ? KORA_UPLOAD_KEY_PASSWORD
                : 'koraci-release'
            def store = file(storePath)
            if (!store.exists()) {
                throw new GradleException(
                    "No signing key found. Set KORA_UPLOAD_KEYSTORE_BASE64 (and KORA_UPLOAD_STORE_PASSWORD, " +
                    "KORA_UPLOAD_KEY_ALIAS, KORA_UPLOAD_KEY_PASSWORD) as GitHub secrets, then re-run. " +
                    "The committed android/app/keystore/kora-ci.jks is intentionally invalid and must not be used for releases."
                )
            }
            storeFile store
            storePassword storePass
            keyAlias alias
            keyPassword keyPass
        }
    }
    buildTypes {
        debug {
            // Keep applicationId = app.kora.reader so it matches google-services.json
            debuggable true
            minifyEnabled false
        }
        release {
            // Phase 1.2 (REVERTED to known-good): the freshly-enabled R8 minify +
            // shrink caused a white-screen / no-launch on device in release builds
            // (unverifiable from CI, which only compiles). Restored to the prior
            // working config. The ABI split below still delivers most of the APK
            // size win. Re-enabling minify requires on-device logcat validation.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    // Phase 1.3: ship only the architectures modern phones use.
    // Roughly halves the release APK size vs. the universal (all-ABI) build.
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Firebase Android BoM — keeps SDK versions aligned
    implementation platform('com.google.firebase:firebase-bom:34.16.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-auth'
}

apply from: 'capacitor.build.gradle'
