name: CI

on:
  push:
    branches: [main, beta, "cursor/**"]
  pull_request:
    branches: [main, beta]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: API smoke (source-fetch + search)
        run: |
          node dist/server.cjs &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5000/api/google-books/search?q=test\&maxResults=1 >/dev/null; then
              break
            fi
            sleep 2
          done
          npm run test:api-health
          npm run test:plugins
          kill $SERVER_PID
