name: iOS Build (.ipa)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'capacitor.config.ts'
      - '.github/workflows/ios-build.yml'

env:
  NODE_VERSION: '20'
  IOS_SCHEME: 'App'

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Upload dist for debugging
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 7

      - name: Verify Capacitor iOS platform exists
        run: |
          if [ ! -d "ios/App" ]; then
            echo "❌ iOS platform not found. Run 'npx cap add ios' locally first."
            exit 1
          fi
          ls -la ios/App/App.xcworkspace

      - name: Copy web assets to iOS project
        run: npx cap copy ios

      - name: Set up Xcode build environment
        run: |
          # Ensure Xcode is properly selected
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Clean previous builds
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData/App-*)
          xcodebuild -alltargets -allconfigurations clean 2>/dev/null || true

      - name: Archive iOS app
        run: |
          ARCHIVE_PATH="${{ github.workspace }}/build/Kora.xcarchive"
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration ${{ github.event.inputs.build_type }} \
            -destination generic/platform=iOS \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=automatic \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            archive \
            -resultBundlePath "${{ github.workspace }}/build/App.xcresult"

      - name: Export IPA
        run: |
          IPA_PATH="${{ github.workspace }}/build/ipa/App.ipa"
          EXPORT_DIR="${{ github.workspace }}/build/export"
          mkdir -p "$EXPORT_DIR"

          xcodebuild -exportArchive \
            -archivePath "${{ github.workspace }}/build/Kora.xcarchive" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist <(cat << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <dict>
            <key>method</key><string>app-store</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string></string>
            <key>compileBitcode</key><false/>
            <key>stripSwiftSymbols</key><true/>
            <key>manifest</key>
            <dict>
              <key>appURL</key><string>YOUR_APP_STORE_URL</string>
              <key>displayImageURL</key><string>YOUR_PNG_URL</string>
              <key>fullSizeImageURL</key><string>YOUR_PNG_URL</string>
            </dict>
          </dict>
          EOF
          )

          # Find the exported .ipa
          IPA_FILE=$(find "$EXPORT_DIR" -name "*.ipa" -type f | head -1)
          if [ -n "$IPA_FILE" ] && [ -f "$IPA_FILE" ]; then
            mv "$IPA_FILE" "$IPA_PATH"
            echo "✅ IPA exported to $IPA_PATH"
          else
            echo "❌ No IPA found in $EXPORT_DIR"
            ls -la "$EXPORT_DIR"
            exit 1
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kora-iOS-IPA
          path: build/ipa/App.ipa
          retention-days: 30

      - name: Deploy IPA to Workers (optional)
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Install Wrangler if not present
          npm install -g wrangler

          # Upload IPA to Workers KV or R2
          # Note: Workers Sites can serve static files via wrangler deploy
          # For direct download, you may want to use R2 or a separate CDN
          echo "IPA is available at: build/ipa/App.ipa"
          echo "To host for direct install, upload to your preferred CDN/Workers site"

      - name: Summary
        run: |
          echo "## iOS Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Type:** ${{ github.event.inputs.build_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Node Version:** ${{ env.NODE_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Xcode:** $(xcodebuild -version | head -1)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifact" >> $GITHUB_STEP_SUMMARY
          echo "- IPA: \`build/ipa/App.ipa\` (uploaded as artifact)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the IPA from the workflow artifacts" >> $GITHUB_STEP_SUMMARY
          echo "2. For **Ad Hoc distribution**:" >> $GITHUB_STEP_SUMMARY
          echo "   - Requires Apple Developer account + registered device UDIDs" >> $GITHUB_STEP_SUMMARY
          echo "   - Use a separate workflow with code signing credentials" >> $GITHUB_STEP_SUMMARY
          echo "3. For **TestFlight**:" >> $GITHUB_STEP_SUMMARY
          echo "   - Requires App Store Connect configuration" >> $GITHUB_STEP_SUMMARY
          echo "   - Use `fastlane` or `xcodebuild` with App Store export options" >> $GITHUB_STEP_SUMMARY